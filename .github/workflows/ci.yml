name: decrypto-security-project
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run Python unit tests
        run: |
          python -m unittest discover -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run npm install & audit (if JS package exists)
        run: |
          if [ -f js/package.json ]; then
            npm --prefix js install
            npm --prefix js audit --audit-level=high
          else
            echo "No js/package.json, skipping npm steps"
          fi
